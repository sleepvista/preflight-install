# Preflight, pointed at the n8n you already run. Generated for release 0.3.1
# from the file the Preflight repository tests; do not edit it by hand.
#
#   docker compose up -d
#
# Two values are required in .env and the stack refuses to start without them:
# PREFLIGHT_SECRET and PREFLIGHT_N8N_VERSION. INSTALL.md says what each one is,
# how to get your beta key in, and how to update. The API image is pinned by
# digest as well as version, so what you pull is exactly what was released.

name: preflight-selfhost
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-preflight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preflight_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-preflight}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: ghcr.io/sleepvista/preflight-api:0.3.1@sha256:d83b8b6aab6fa281b98d53221868a05941cd97d39db0cd98b40ddc6f4f276caf
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-preflight}:${POSTGRES_PASSWORD:-preflight_local_dev}@postgres:5432/${POSTGRES_DB:-preflight}
      PREFLIGHT_SECRET: ${PREFLIGHT_SECRET:?set PREFLIGHT_SECRET in your .env — see INSTALL.md for how to generate one}
      SANDBOX_N8N_URL: http://n8n-sandbox:5678
      SANDBOX_N8N_URLS: '{"${PREFLIGHT_N8N_VERSION:?set PREFLIGHT_N8N_VERSION to your n8n version, e.g. 2.36.8}": "http://n8n-sandbox:5678"}'
      ALLOW_VERSION_SKEW: ${ALLOW_VERSION_SKEW:-false}
      ALLOW_PRIVATE_INSTANCE_URLS: ${ALLOW_PRIVATE_INSTANCE_URLS:-true}
      ALLOW_INSECURE_INSTANCE_URLS: ${ALLOW_INSECURE_INSTANCE_URLS:-false}
      PREFLIGHT_SECRET_PREVIOUS: ${PREFLIGHT_SECRET_PREVIOUS:-}
      PREFLIGHT_REDACTION_SECRET: ${PREFLIGHT_REDACTION_SECRET:-}
      PREFLIGHT_AGENT_TOKEN: ${PREFLIGHT_AGENT_TOKEN:-}
      INSTANCE_RESPONSE_MAX_BYTES: ${INSTANCE_RESPONSE_MAX_BYTES:-104857600}
      PREFLIGHT_AUTO_MIGRATE: ${PREFLIGHT_AUTO_MIGRATE:-true}
      PREFLIGHT_RUNNER: ${PREFLIGHT_RUNNER:-true}
      PREFLIGHT_BETA_KEY: ${PREFLIGHT_BETA_KEY:-}
      PUBLIC_BASE_URL: http://api:8000
      SANDBOX_STATE_DIR: /preflight-state/sandbox
      PREFLIGHT_STATE_DIR: /preflight-state
      PREFLIGHT_API_TOKEN: ${PREFLIGHT_API_TOKEN:-}
    networks:
    - default
    - sandbox
    ports:
    - 127.0.0.1:8000:8000
    volumes:
    - preflight-state:/preflight-state
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      n8n-sandbox:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETUID
    - SETGID
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
  n8n-sandbox:
    image: docker.n8n.io/n8nio/n8n:${PREFLIGHT_N8N_VERSION:?set PREFLIGHT_N8N_VERSION to your n8n version, e.g. 2.36.8}
    environment:
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_RUNNERS_ENABLED: 'true'
      GENERIC_TIMEZONE: ${PREFLIGHT_TIMEZONE:-UTC}
      TZ: ${PREFLIGHT_TIMEZONE:-UTC}
      NODE_FUNCTION_ALLOW_BUILTIN: ''
      NODE_FUNCTION_ALLOW_EXTERNAL: ''
      N8N_RUNNERS_INSECURE_MODE: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      EXECUTIONS_TIMEOUT: '150'
      EXECUTIONS_TIMEOUT_MAX: '300'
      N8N_RUNNERS_TASK_TIMEOUT: '150'
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger"]'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'true'
    networks:
    - sandbox
    mem_limit: 1g
    pids_limit: 512
    cpus: 1.0
    volumes:
    - n8n-sandbox-data:/home/node/.n8n
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://localhost:5678/healthz'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 30
networks:
  default: null
  sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    enable_ipv6: false
volumes:
  postgres-data: null
  n8n-sandbox-data: null
  preflight-state: null
