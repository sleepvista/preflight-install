networks:
  default: null
  sandbox:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    enable_ipv6: false
  sandbox-2:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    enable_ipv6: false
  sandbox-3:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    enable_ipv6: false
  sandbox-4:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    enable_ipv6: false
  database:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    enable_ipv6: false
volumes:
  postgres-data: null
  n8n-sandbox-data: null
  n8n-sandbox-2-data: null
  n8n-sandbox-3-data: null
  n8n-sandbox-4-data: null
  preflight-state: null
